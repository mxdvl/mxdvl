name: CI
on:
  pull_request:
    types: [opened, synchronize]
  push:
    branches:
      - main

jobs:
  deno:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: denoland/setup-deno@v2
        with:
          deno-version: 2.9.x

      - name: Format
        run: deno fmt

      - name: Lint
        run: deno lint

      - name: Type-check
        run: deno check deno/**.ts

      - name: Test
        run: deno test deno/*.js lib/*.test.js
